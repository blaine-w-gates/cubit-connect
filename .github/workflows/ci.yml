name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run full tests every Sunday at 2 AM UTC (weekly)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode to run'
        type: choice
        options:
          - focused
          - full-chrome
          - full-matrix
        default: 'focused'

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm audit --audit-level=high --omit=dev 2>/dev/null || true
        continue-on-error: true

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Note: No Supabase env vars needed - tests use mocks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run tests/unit --no-file-parallelism --reporter=verbose
      - name: Verify minimum test count
        run: |
          npx vitest run tests/unit --no-file-parallelism --reporter=json --outputFile=/tmp/test-results.json 2>&1 || true
          COUNT=$(grep -o '"numTotalTests":[0-9]*' /tmp/test-results.json | grep -o '[0-9]*')
          echo "Unit test count: $COUNT"
          if [ "$COUNT" -lt 450 ]; then
            echo "❌ FAIL: Only $COUNT unit tests ran (expected ≥450). Tests may be silently skipping."
            exit 1
          fi
          echo "✅ PASS: $COUNT unit tests ran"

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit  # Run after unit tests pass
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # Integration tests run separately with real network
      - run: npm run test:integration -- --reporter=verbose --maxWorkers=2
      - name: Verify integration test count
        run: |
          npm run test:integration -- --reporter=json --maxWorkers=2 --outputFile=/tmp/integration-results.json 2>&1 || true
          COUNT=$(grep -o '"numTotalTests":[0-9]*' /tmp/integration-results.json | grep -o '[0-9]*')
          echo "Integration test count: $COUNT"
          if [ "$COUNT" -lt 90 ]; then
            echo "❌ FAIL: Only $COUNT integration tests ran (expected ≥90). Supabase secrets may be missing."
            exit 1
          fi
          echo "✅ PASS: $COUNT integration tests ran"

  # FULL CHROME TESTS: Run weekly on schedule, manual trigger, or PRs touching store/sync code
  test-chrome:
    name: Full Chrome Tests
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.test_mode == 'full-chrome' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'needs-chrome-tests'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Run full Chrome tests
        # Playwright will start webServer automatically, CI=true ensures fresh server instances
        run: CI=true npx playwright test --project="Desktop Chrome" --reporter=line --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-chrome
          path: playwright-report/
          retention-days: 14

  # FULL MATRIX: Manual trigger only (13 devices)
  test-full:
    name: Full Matrix (13 Devices)
    if: github.event.inputs.test_mode == 'full-matrix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Run full Playwright matrix
        run: npx playwright test --reporter=line --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 30
